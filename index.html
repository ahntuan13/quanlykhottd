<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý Kho – TTD</title>
<meta name="description" content="Web app quản lý kho & IT Asset – chạy thuần trình duyệt, deploy được trên GitHub Pages">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1e33'/%3E%3Cpath d='M12 24l20-10 20 10v22L32 56 12 46z' fill='%23e4570e'/%3E%3Cpath d='M12 24l20 10 20-10M32 34v22' stroke='%230f1e33' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#0f1e33; --ink2:#33445c; --muted:#66768c; --line:#dde3eb; --line2:#eaeef3;
  --side:#0f1e33; --side2:#182b46; --side-t:#aebbcc;
  --acc:#e4570e; --acc-d:#c2470a; --acc-s:#fdece2;
  --ok:#0f7b4b; --ok-s:#dff5e9; --warn:#a85a00; --warn-s:#fdf0d5; --bad:#b3261e; --bad-s:#fde6e4; --info:#1c4fb8; --info-s:#e1ebfd; --mute-s:#e9edf2;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.muted{color:var(--muted)}
.sp{flex:1}
.contents{display:contents}
.r{text-align:right}.c{text-align:center}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:268px;flex:none;background:var(--side);color:var(--side-t);position:sticky;top:0;height:100vh;overflow:auto;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .lg{width:36px;height:36px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font-size:19px}
.brand b{display:block;color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.brand span{font-size:12px;color:#8496ad}
.nav{padding:10px 10px 28px}
.ngh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#e4eaf2;padding:9px 10px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13.5px;text-align:left}
.ngh:hover{background:var(--side2)}
.ngh .ic{width:22px;text-align:center;font-size:15px}
.ngh .chev{margin-left:auto;font-size:9px;opacity:.55;transition:transform .15s}
.ng.open .chev{transform:rotate(90deg)}
.ngi{display:none;margin:2px 0 8px 21px;padding-left:10px;border-left:1px solid rgba(255,255,255,.1)}
.ng.open .ngi{display:block}
.ngi a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;margin:1px 0;color:var(--side-t);text-decoration:none;border-radius:5px;font-size:13px;border-left:3px solid transparent;margin-left:-13px;padding-left:20px}
.ngi a:hover{background:var(--side2);color:#fff}
.ngi a.on{background:var(--side2);color:#fff;border-left-color:var(--acc);font-weight:600}
.bubble{background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600;line-height:18px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 26px;background:rgba(238,241,245,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.1px}
.crumb{font-size:12px;color:var(--muted)}
.usr{display:flex;align-items:center;gap:10px}
.usr .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.usr b{display:block;font-size:13px;line-height:1.2}.usr small{color:var(--muted);font-size:11.5px}
.content{padding:20px 26px 56px;width:100%;max-width:1600px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:6px;width:36px;height:36px;font-size:18px;cursor:pointer}
.scrim{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f6f8fb;border-color:#c9d2de}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#1b3150}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.acc:hover{background:var(--acc-d)}
.btn.danger{color:var(--bad);border-color:#f0c7c3}.btn.danger:hover{background:var(--bad-s)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.block{width:100%;padding:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.in{width:100%;padding:7px 10px;border:1px solid #cfd7e2;border-radius:var(--r);background:#fff;min-height:36px}
.in:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.in.bad{border-color:var(--bad);background:var(--bad-s)}
textarea.in{resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .in{width:auto;min-width:150px}
.bar .srch{min-width:240px}
.fl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.fl .in{min-width:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12.5px;color:var(--ink2);font-weight:500}
.f>span i{color:var(--bad);font-style:normal}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fg3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;margin-bottom:14px}
.full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--acc)}

/* ---------- panels, kpi ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.card>h4{font-size:14.5px;font-weight:600;margin-bottom:12px}
.card .sub{font-size:12.5px;color:var(--muted);margin:-8px 0 12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--r);padding:12px 16px}
.kpi.acc{border-left-color:var(--acc)}.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:#d98a00}.kpi.bad{border-left-color:var(--bad)}.kpi.info{border-left-color:var(--info)}
.kl{font-size:12.5px;color:var(--muted)}
.kv{font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.3px}
.ks{font-size:12px;color:var(--muted)}
.kpis.sm .kv{font-size:19px}
.ch{position:relative;height:270px}
.ch.tall{height:340px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed #c9d2de;border-radius:var(--r)}
.note{font-size:12.5px;color:var(--muted);padding:8px 2px}
.meta{font-size:12.5px;color:var(--muted);padding:0 2px 6px}

/* ---------- tables ---------- */
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 250px)}
.card .tw{border:0;max-height:none}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{position:sticky;top:0;background:#f4f6f9;text-align:left;font-weight:600;font-size:12.5px;color:var(--ink2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tbody tr:hover td{background:#f9fafc}
table.t .num{text-align:right}
table.t th.num{text-align:right}
table.t td.act{white-space:nowrap;text-align:right}
table.t tfoot td{font-weight:700;background:#f4f6f9;border-top:1px solid var(--line)}
table.t td small{display:block;color:var(--muted);font-size:12px}
.lnk{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font-weight:600;text-decoration:none}
.lnk:hover{text-decoration:underline}
.bd{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.bd.ok{background:var(--ok-s);color:var(--ok)}.bd.warn{background:var(--warn-s);color:var(--warn)}.bd.bad{background:var(--bad-s);color:var(--bad)}.bd.info{background:var(--info-s);color:var(--info)}.bd.mute{background:var(--mute-s);color:var(--ink2)}
.tag-bad{color:var(--bad);font-weight:600}.tag-warn{color:var(--warn);font-weight:600}.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,30,51,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:100;overflow:auto}
.md{background:#fff;border-radius:10px;width:100%;max-width:640px;display:flex;flex-direction:column;max-height:92vh;box-shadow:0 20px 50px rgba(15,30,51,.3)}
.md.wide{max-width:980px}.md.mid{max-width:820px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:16px;font-weight:600}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:6px}.x:hover{background:var(--mute-s)}
.mb{padding:18px 20px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:4px solid var(--ok);transition:opacity .3s}
.toast.error{border-left-color:#ff6b61}.toast.warn{border-left-color:#ffb74d}.toast.out{opacity:0}

/* ---------- slip form ---------- */
.lh{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.ln{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;background:#fbfcfd}
.ln-main{display:grid;grid-template-columns:minmax(200px,1fr) 48px 96px 96px 34px;gap:8px;align-items:center}
.ln-main.isr{grid-template-columns:minmax(200px,1fr) 48px 92px 130px 120px 34px}
.ln .unit{color:var(--muted);font-size:12.5px}
.ln .stk{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ln .stk.bad{color:var(--bad);font-weight:600}
.ln .amt{text-align:right;font-weight:600}
.ln details{margin-top:8px}
.ln summary{cursor:pointer;font-size:13px;color:var(--info);font-weight:500}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px;padding:8px 2px 2px;max-height:180px;overflow:auto}
.ser{display:grid;grid-template-columns:1fr 150px;gap:10px;margin-top:8px}
.ser textarea{min-height:64px}
.tot{display:flex;justify-content:flex-end;gap:24px;font-weight:600;padding:8px 2px}
.take-in{width:110px;text-align:right}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--side) 0 46%,var(--bg) 46% 100%)}
.lcard{background:#fff;width:100%;max-width:380px;border-radius:12px;padding:30px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(15,30,51,.28)}
.lcard .lm{width:48px;height:48px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-size:24px}
.lcard h1{font-size:22px;letter-spacing:-.2px}
.lcard p{color:var(--muted);margin-top:-8px}
.hint{font-size:12.5px;color:var(--muted);background:var(--mute-s);padding:8px 10px;border-radius:6px}

/* ---------- slip (phiếu) ---------- */
.slip{background:#fff;color:#111;font-family:'Be Vietnam Pro',Arial,sans-serif;font-size:12px;line-height:1.45;padding:26px 34px;width:100%;max-width:794px;margin:0 auto;border:1px solid var(--line)}
.slip .sh{display:flex;justify-content:space-between;gap:20px}
.slip .co b{font-size:13px;text-transform:uppercase}
.slip h2{text-align:center;font-size:20px;margin:14px 0 2px;letter-spacing:.3px}
.slip .sub{text-align:center;color:#444;margin-bottom:12px}
.slip .mt{display:grid;grid-template-columns:1fr 1fr;gap:3px 24px;margin-bottom:8px}
.slip table{width:100%;border-collapse:collapse;margin-top:6px}
.slip th,.slip td{border:1px solid #333;padding:5px 6px;vertical-align:top}
.slip th{background:#f0f0f0;text-align:center}
.slip .sn{font-size:10.5px;color:#444;margin-top:2px}
.slip .sign{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:20px;gap:8px}
.slip .sign div{min-height:92px}
.slip .sign small{color:#555}
.rpt-doc{background:#fff;color:#111;padding:20px 24px}
.rpt-doc .rpt-hd{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px}
.rpt-doc h2{font-size:20px;margin:8px 0 2px}
.rpt-doc .sub{color:#555;margin-bottom:12px;font-size:12.5px}
.rpt-doc .kpis{margin-bottom:10px}
.rpt-doc .tw{max-height:none;overflow:visible}
#print-area{display:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .side{position:fixed;left:-290px;top:0;transition:left .2s}
  .side.open{left:0;box-shadow:0 0 0 100vmax rgba(15,30,51,.45)}
  .burger{display:inline-grid;place-items:center}
  .top{padding:10px 14px}.content{padding:14px 12px 48px}
  .g2,.g3{grid-template-columns:1fr}
  .usr div{display:none}
  .tw{max-height:none}
}
@media (max-width:640px){
  .fg,.fg3{grid-template-columns:1fr}
  .ln-main,.ln-main.isr{grid-template-columns:1fr 1fr}
  .ln-main .itm{grid-column:1/-1}
  .ser{grid-template-columns:1fr}
  .bar .in,.bar .srch{min-width:0;flex:1 1 140px}
  .slip{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- print ---------- */
@media print{
  body.printing>*:not(#print-area){display:none!important}
  body.printing #print-area{display:block}
  body{background:#fff}
  .slip{border:0;padding:0;max-width:none}
  .pb{page-break-after:always}
  @page{margin:12mm}
}
/* ---------- combobox & import ---------- */
.cbp{position:fixed;z-index:300;background:#fff;border:1px solid #c9d2de;border-radius:8px;box-shadow:0 10px 30px rgba(15,30,51,.22);overflow:auto;padding:4px}
.cbo{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.cbo b{font-weight:500;font-size:13.5px}.cbo small{color:var(--muted);font-size:12px}
.cbo.on,.cbo:hover{background:var(--acc-s)}
.cbe{padding:10px;color:var(--muted);font-size:13px}
.imp-notes{max-height:200px;overflow:auto;background:#f7f9fb;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12.5px;margin:0;list-style:disc inside}
.imp-notes li{margin:2px 0}
table.t td.addr{min-width:220px;white-space:normal}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toasts"></div>
<div id="print-area"></div>

<!-- Thư viện (CDN) – GitHub Pages tải trực tiếp, không cần cài đặt -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(()=>{
'use strict';
/* =====================================================================
   QUẢN LÝ KHO – TTD
   Dữ liệu lưu trong localStorage của trình duyệt (không cần server).
   Sao lưu / khôi phục bằng file JSON: Settings → Sao lưu & Hệ thống.
   ===================================================================== */
const LS_KEY='ttd_wms_v1', SS_KEY='ttd_wms_uid', FB_LS='ttd_wms_fbcfg';

/* ---------- Firebase (dùng chung dữ liệu) ----------
   Cách 1: dán cấu hình vào biến bên dưới (khuyên dùng khi deploy GitHub Pages), ví dụ:
     const FIREBASE_CONFIG={apiKey:'...',authDomain:'...',projectId:'...',appId:'...'};
   Cách 2: để null rồi bấm “Kết nối Firebase” ở màn hình đăng nhập để dán cấu hình.
   Không cấu hình → app chạy chế độ cục bộ (lưu trong trình duyệt). */
const FIREBASE_CONFIG={
  apiKey: "AIzaSyBDRkwAueW6r3gVeuRiQYO1DG23D4sMkTo",
  authDomain: "kho-ttd.firebaseapp.com",
  projectId: "kho-ttd",
  storageBucket: "kho-ttd.firebasestorage.app",
  messagingSenderId: "830398147860",
  appId: "1:830398147860:web:058425fe23c69557922601",
  measurementId: "G-7YTTWMMX11"
};
const FBCFG=(()=>{if(FIREBASE_CONFIG)return FIREBASE_CONFIG;try{return JSON.parse(localStorage.getItem(FB_LS)||'null')}catch(e){return null}})();
const CLOUD=!!(FBCFG&&FBCFG.apiKey&&FBCFG.projectId);

/* ---------- tiện ích ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>dstr(new Date());
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return dstr(new Date(y,m-1,d+n))}
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);return dstr(new Date(y,m-1+n,d))}
const fmtDate=s=>s?s.split('-').reverse().join('/'):'';
const fmtDT=iso=>{if(!iso)return'';const d=new Date(iso);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtNum=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(+n||0);
const fmtMoney=n=>fmtNum(Math.round(+n||0));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const strip=h=>{const d=document.createElement('div');d.innerHTML=String(h??'');return d.textContent.trim()};
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
const cell=v=>String(v??'').replace(/\s+/g,' ').trim();
function numVN(v){if(typeof v==='number')return v;let s=String(v??'').replace(/\s/g,'');if(!s)return 0;if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n}
const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function lastMonths(n){const o=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);o.push(`${x.getFullYear()}-${pad(x.getMonth()+1)}`)}return o}
const mLabel=mk=>`${mk.slice(5)}/${mk.slice(2,4)}`;

function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const pw=p=>hash('ttd-wms|'+p);

/* Đọc số tiền thành chữ (tiếng Việt) */
function readVN(n){
  n=Math.round(+n||0); if(n===0) return 'Không đồng';
  const dg=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const un=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'];
  const r3=(x,full)=>{const h=Math.floor(x/100),t=Math.floor(x%100/10),u=x%10;let s='';
    if(h>0||full) s+=dg[h]+' trăm';
    if(t>1){s+=' '+dg[t]+' mươi';if(u===1)s+=' mốt';else if(u===5)s+=' lăm';else if(u>0)s+=' '+dg[u]}
    else if(t===1){s+=' mười';if(u===5)s+=' lăm';else if(u>0)s+=' '+dg[u]}
    else if(u>0){if(h>0||full)s+=' lẻ';s+=' '+dg[u]}
    return s.trim()};
  const g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000)}
  const parts=[];
  for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;parts.push(r3(g[i],i<g.length-1)+(un[i]?' '+un[i]:''))}
  const s=parts.join(' ').replace(/\s+/g,' ').trim();
  return s.charAt(0).toUpperCase()+s.slice(1)+' đồng';
}

/* ---------- tồn kho ---------- */
/* asOf: tính đến ngày (gồm); exclusive=true: chỉ tính trước ngày đó */
function stockMap(asOf,exclusive){
  const m={};const add=(i,w,q)=>{const o=(m[i]??={});o[w]=(o[w]||0)+q};
  const ok=d=>!asOf||(exclusive?d<asOf:d<=asOf);
  db.receipts.forEach(r=>{if(ok(r.date))r.lines.forEach(l=>add(l.itemId,r.warehouseId,+l.qty||0))});
  db.issues.forEach(r=>{if(ok(r.date))r.lines.forEach(l=>add(l.itemId,r.warehouseId,-(+l.qty||0)))});
  db.adjustments.forEach(a=>{if(ok(a.date))add(a.itemId,a.warehouseId,+a.qty||0)});
  db.stocktakes.forEach(s=>{if(ok(s.date))s.lines.forEach(l=>add(l.itemId,s.warehouseId,(+l.actual||0)-(+l.system||0)))});
  for(const i in m)for(const w in m[i])m[i][w]=Math.round(m[i][w]*1000)/1000;
  return m;
}
const totalOf=(m,id)=>Object.values(m[id]||{}).reduce((a,b)=>a+b,0);
const qtyIn=(m,id,wh)=>wh?(m[id]?.[wh]||0):totalOf(m,id);
function findNegative(){const m=stockMap();for(const i in m)for(const w in m[i])if(m[i][w]<-1e-9)return `${nm(db.items,i)} tại ${whName(w)} (${fmtNum(m[i][w])})`;return null}
function flow(kind,from,to,wh){
  const o={};
  db[kind].forEach(r=>{
    if((from&&r.date<from)||(to&&r.date>to)||(wh&&r.warehouseId!==wh))return;
    r.lines.forEach(l=>{const x=(o[l.itemId]??={qty:0,val:0});const q=+l.qty||0;x.qty+=q;x.val+=q*(+l.price||itemOf(l.itemId)?.price||0)});
  });
  return o;
}
function itemStatus(it,t){if(t<=0)return['bad','Hết hàng'];if(it.minStock>0&&t<=it.minStock)return['warn','Sắp hết'];return['ok','Còn hàng']}
function alertsData(){
  const m=stockMap(),moved=new Set();db.receipts.forEach(r=>r.lines.forEach(l=>moved.add(l.itemId)));
  const low=[],out=[];
  db.items.forEach(it=>{const t=totalOf(m,it.id);
    if(t<=0){if(moved.has(it.id)||it.minStock>0)out.push({it,t})}
    else if(it.minStock>0&&t<=it.minStock)low.push({it,t});
  });
  const lim=addDays(todayStr(),60);
  const warr=db.assets.filter(a=>a.warrantyEnd&&a.status!=='retired'&&a.warrantyEnd<=lim).sort((a,b)=>a.warrantyEnd.localeCompare(b.warrantyEnd));
  const repair=db.assets.filter(a=>a.status==='repair');
  return{low,out,warr,repair};
}
const alertCount=()=>{const a=alertsData();return a.low.length+a.out.length+a.warr.length+a.repair.length};

function transact(fn){
  const snap=JSON.stringify(db);

    fn();

/* ---------- mã phiếu, tài sản ---------- */
function maxNum(list,re){let m=0;list.forEach(s=>{const x=re.exec(s||'');if(x)m=Math.max(m,+x[1])});return m}
function nextCode(kind){const y=String(new Date().getFullYear()).slice(2),src={PN:db.receipts,PX:db.issues,KK:db.stocktakes}[kind]||[];db.seq[kind]=Math.max(db.seq[kind]||0,maxNum(src.map(r=>r.code),new RegExp('^'+kind+'\\d{2}-(\\d+)$')))+1;return `${kind}${y}-${String(db.seq[kind]).padStart(4,'0')}`}
function nextTag(){db.seq.TS=Math.max(db.seq.TS||0,maxNum(db.assets.map(a=>a.tag),/^TS-(\d+)$/))+1;return 'TS-'+String(db.seq.TS).padStart(5,'0')}
function autoSku(){let s;do{db.seq.HH=Math.max(db.seq.HH||0,maxNum(db.items.map(i=>i.sku),/^HH-(\d+)$/))+1;s='HH-'+String(db.seq.HH).padStart(4,'0')}while(db.items.some(x=>x.sku===s));return s}
function addHist(a,action,detail,date){(a.history??=[]).push({id:uid('h'),ts:new Date().toISOString(),date:date||todayStr(),action,detail,by:session?.name||'system'})}
function pushAdj(itemId,warehouseId,qty,reason,date){db.adjustments.push({id:uid('adj'),date:date||todayStr(),warehouseId,itemId,qty,reason,createdBy:session?.name||'system'})}

/* Phiếu nhập → tạo/đồng bộ tài sản theo Serial */
function syncReceiptAssets(r){
  const want=[];r.lines.forEach(l=>(l.serials||[]).forEach(s=>want.push({itemId:l.itemId,serial:s,warranty:l.warranty})));
  const key=(i,s)=>i+'|'+String(s||'').toLowerCase();
  const have=db.assets.filter(a=>a.receiptId===r.id);
  const wantKeys=new Set(want.map(w=>key(w.itemId,w.serial)));
  for(const a of have){
    if(!wantKeys.has(key(a.itemId,a.serial))){
      if(a.status!=='in_stock'||!a.counted)throw new Error(`Không thể bỏ Serial ${a.serial}: thiết bị đã được cấp phát/xử lý`);
      db.assets=db.assets.filter(x=>x!==a);
    }else{
      const w=want.find(x=>key(x.itemId,x.serial)===key(a.itemId,a.serial));
      a.purchaseDate=r.date;a.warrantyEnd=w.warranty?addMonths(r.date,+w.warranty):'';
      if(a.status==='in_stock')a.warehouseId=r.warehouseId;
    }
  }
  const haveKeys=new Set(have.filter(a=>db.assets.includes(a)).map(a=>key(a.itemId,a.serial)));
  for(const w of want){
    if(haveKeys.has(key(w.itemId,w.serial)))continue;
    if(db.assets.some(a=>key(a.itemId,a.serial)===key(w.itemId,w.serial)))throw new Error(`Serial ${w.serial} đã tồn tại trong danh sách tài sản`);
    const a={id:uid('a'),tag:nextTag(),itemId:w.itemId,serial:w.serial,spec:'',status:'in_stock',counted:true,warehouseId:r.warehouseId,holder:null,issueId:null,receiptId:r.id,purchaseDate:r.date,warrantyEnd:w.warranty?addMonths(r.date,+w.warranty):'',note:'',history:[]};
    addHist(a,'Nhập kho',`Phiếu nhập ${r.code}`,r.date);db.assets.push(a);
  }
}
function _newReceipt(o){const r={id:uid('r'),code:nextCode('PN'),createdBy:session?.name||'system',createdAt:Date.now(),...o};db.receipts.push(r);syncReceiptAssets(r);return r}

/* Phiếu xuất → gán/thu hồi tài sản */
function applyIssueAssets(r){
  const seen=new Set();
  r.lines.forEach(l=>(l.assetIds||[]).forEach(id=>{
    const a=by(db.assets,id);if(!a)throw new Error('Thiết bị đã chọn không còn tồn tại');
    if(seen.has(id))throw new Error(`Thiết bị ${a.tag} bị chọn trùng`);seen.add(id);
    if(a.status!=='in_stock'||a.itemId!==l.itemId||a.warehouseId!==r.warehouseId)throw new Error(`Thiết bị ${a.tag} không khả dụng để xuất (không ở trạng thái Trong kho hoặc khác kho)`);
    a.status='assigned';a.counted=false;a.holder={type:r.targetType,id:r.targetId};a.issueId=r.id;
    addHist(a,'Cấp phát',`${r.code} → ${targetLabel(r.targetType,r.targetId)}`,r.date);
  }));
}
function revertIssueAssets(r){
  r.lines.forEach(l=>(l.assetIds||[]).forEach(id=>{
    const a=by(db.assets,id);if(!a)return;
    if(a.issueId!==r.id)throw new Error(`Thiết bị ${a.tag} đã thay đổi trạng thái sau khi cấp phát nên không thể sửa/huỷ phiếu ${r.code}`);
    a.status='in_stock';a.counted=true;a.holder=null;a.issueId=null;a.warehouseId=r.warehouseId;
    addHist(a,'Thu hồi',`Huỷ/sửa phiếu xuất ${r.code}`);
  }));
}
function _newIssue(o){const r={id:uid('i'),code:nextCode('PX'),createdBy:session?.name||'system',createdAt:Date.now(),...o};db.issues.push(r);applyIssueAssets(r);return r}

function table(cols,rows,{empty='Chưa có dữ liệu.',limit=1000,foot=''}={}){
  ui.cur={cols,rows};
  if(!rows.length)return `<div class="empty">${empty}</div>`;
  const shown=rows.slice(0,limit);
  return `<div class="meta">${fmtNum(rows.length)} dòng</div><div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th class="${c.c||''}">${c.h}</th>`).join('')}</tr></thead><tbody>${shown.map(r=>`<tr>${cols.map(c=>`<td class="${c.c||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot>${foot}</tfoot>`:''}</table></div>${rows.length>limit?`<div class="note">Đang hiển thị ${limit}/${fmtNum(rows.length)} dòng đầu. Dùng bộ lọc để thu hẹp hoặc xuất Excel để lấy đầy đủ.</div>`:''}`;
}
const actCol=fn=>({h:'',c:'act',noexp:1,f:fn});
function xlsxSave(aoa,name,sheet='Data'){
  if(!window.XLSX)return toast('Chưa tải được thư viện Excel (SheetJS). Kiểm tra kết nối mạng.','error');
  const ws=XLSX.utils.aoa_to_sheet(aoa);

}

function offscreen(html,width=794){const d=document.createElement('div');d.style.cssText=`position:fixed;left:-99999px;top:0;width:${width}px;background:#fff;z-index:-1`;d.innerHTML=html;document.body.appendChild(d);return d}

window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');const p=$('#print-area');if(p)p.innerHTML=''});
async function pdfFromEls(els,filename,{landscape=false}={}){
  if(!window.html2canvas||!window.jspdf)return toast('Chưa tải được thư viện PDF (html2canvas / jsPDF). Kiểm tra kết nối mạng.','error');
  try{
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:landscape?'l':'p',unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();let first=true;
    for(const el of els){
      const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
      const img=cv.toDataURL('image/jpeg',0.92),ih=cv.height*pw/cv.width;
      if(!first)pdf.addPage();first=false;
      let left=ih,pos=0;pdf.addImage(img,'JPEG',0,pos,pw,ih);left-=ph;
      while(left>1){pos-=ph;pdf.addPage();pdf.addImage(img,'JPEG',0,pos,pw,ih);left-=ph}
    }
    pdf.save(filename);
  }catch(e){toast('Xuất PDF thất bại: '+e.message,'error')}
}

  const c=db.company||{},t=$('#tbl'),clone=t.cloneNode(true);

}

  ui.key=h;PAGE=resolvePage(h);

const kpi=(l,v,s='',tone='')=>`<div class="kpi ${tone}"><div class="kl">${l}</div><div class="kv">${v}</div>${s?`<div class="ks">${s}</div>`:''}</div>`;
const card=(title,body,cls='')=>`<section class="card ${cls}">${title?`<h4>${title}</h4>`:''}${body}</section>`;
const miniTable=(heads,rows,empty='Không có dữ liệu.')=>rows.length?`<div class="tw"><table class="t"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="note">${empty}</div>`;
function stockStats(){const m=stockMap();let qty=0,val=0;db.items.forEach(it=>{const t=totalOf(m,it.id);qty+=t;val+=t*(it.price||0)});return{m,qty,val}}
function monthlyFlow(months){
  return months.map(mk=>{
    let iq=0,iv=0,oq=0,ov=0,ic=0,oc=0;
    db.receipts.forEach(r=>{if(r.date.slice(0,7)!==mk)return;ic++;r.lines.forEach(l=>{iq+=+l.qty||0;iv+=(+l.qty||0)*(+l.price||0)})});
    db.issues.forEach(r=>{if(r.date.slice(0,7)!==mk)return;oc++;r.lines.forEach(l=>{oq+=+l.qty||0;ov+=(+l.qty||0)*(+l.price||0)})});
    return{mk,iq,iv,oq,ov,ic,oc};
  });
}
const byDateDesc=(a,b)=>b.date.localeCompare(a.date)||((b.createdAt||0)-(a.createdAt||0));
const slipTotals=r=>({q:r.lines.reduce((a,l)=>a+(+l.qty||0),0),v:r.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0)});
const slipLink=(k,r)=>`<button class="lnk" data-act="slip-view" data-k="${k}" data-id="${r.id}">${esc(r.code)}</button>`;

function monthTable(months){
  const fl=monthlyFlow(months),tot=fl.reduce((a,x)=>({iq:a.iq+x.iq,iv:a.iv+x.iv,oq:a.oq+x.oq,ov:a.ov+x.ov,ic:a.ic+x.ic,oc:a.oc+x.oc}),{iq:0,iv:0,oq:0,ov:0,ic:0,oc:0});
  const cols=[{h:'Tháng',f:r=>`${r.mk.slice(5)}/${r.mk.slice(0,4)}`},nc('Số phiếu nhập',r=>r.ic),nc('SL nhập',r=>r.iq),nc('Giá trị nhập (₫)',r=>r.iv,fmtMoney),nc('Số phiếu xuất',r=>r.oc),nc('SL xuất',r=>r.oq),nc('Giá trị xuất (₫)',r=>r.ov,fmtMoney)];
  return table(cols,fl,{foot:`<tr><td>Tổng</td><td class="num">${tot.ic}</td><td class="num">${fmtNum(tot.iq)}</td><td class="num">${fmtMoney(tot.iv)}</td><td class="num">${tot.oc}</td><td class="num">${fmtNum(tot.oq)}</td><td class="num">${fmtMoney(tot.ov)}</td></tr>`});
}

function importItems(file){
  if(!window.XLSX)return toast('Chưa tải được thư viện Excel.','error');
  const rd=new FileReader();
  rd.onload=()=>{try{
    const wb=XLSX.read(rd.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const pick=(r,keys)=>{const k=Object.keys(r).find(x=>keys.includes(x.trim().toLowerCase()));return k===undefined?'':r[k]};
    let add=0,upd=0;
    const ok=transact(()=>{rows.forEach(r=>{
      const name=String(pick(r,['tên hàng','tên','name','tên hàng hóa'])).trim();if(!name)return;
      const sku=String(pick(r,['sku','mã','mã hàng'])).trim(),cn=String(pick(r,['danh mục','category','nhóm'])).trim();
      let cat=cn?db.categories.find(c=>c.name.toLowerCase()===cn.toLowerCase()):null;
      if(cn&&!cat){cat={id:uid('c'),name:cn,isIT:false};db.categories.push(cat)}
      const data={name,unit:String(pick(r,['đvt','đơn vị','unit'])).trim()||'Cái',minStock:num(pick(r,['tồn tối thiểu','min','tối thiểu'])),price:num(pick(r,['đơn giá','price','giá'])),note:String(pick(r,['ghi chú','note'])).trim()};
      const it=sku?db.items.find(x=>x.sku.toLowerCase()===sku.toLowerCase()):null;
      if(it){Object.assign(it,data);if(cat)it.categoryId=cat.id;upd++}
      else{db.items.push({id:uid('it'),sku:sku||autoSku(),categoryId:(cat||db.categories.find(c=>!c.isIT)||db.categories[0]).id,...data});add++}
    })});
    if(ok)done(`Đã nhập ${add} mới, cập nhật ${upd} hàng hóa`);
  }catch(e){toast('Không đọc được file: '+e.message,'error')}};
  rd.readAsArrayBuffer(file);
}

const newLine=()=>({itemId:'',itemText:'',qty:1,price:0,serialsText:'',warranty:'',assetIds:[]});
const serialsOf=l=>(l.serialsText||'').split(/\n|,|;/).map(s=>s.trim()).filter(Boolean);
function itemByText(t,exact){
  t=(t||'').trim();if(!t)return null;
  let x=db.items.find(i=>itemLabel(i)===t);if(x||exact)return x||null;
  x=db.items.find(i=>i.sku.toLowerCase()===t.toLowerCase());if(x)return x;
  const c=db.items.filter(i=>i.name.toLowerCase()===t.toLowerCase());return c.length===1?c[0]:null;
}
function slipOpen(kind,id,preset){
  const rec=id?(kind==='receipt'?by(db.receipts,id):by(db.issues,id)):null,w0=rec?.warehouseId||db.warehouses[0]?.id||'';

    lines:rec?rec.lines.map(l=>({itemId:l.itemId,itemText:'',qty:l.qty,price:l.price||0,serialsText:(l.serials||[]).join('\n'),warranty:l.warranty||'',assetIds:[]})):[newLine()]};
  else{const orig={};if(rec)rec.lines.forEach(l=>{orig[l.itemId]=(orig[l.itemId]||0)+(+l.qty||0)});
    S={kind,id:id||null,date:rec?.date||todayStr(),warehouseId:w0,origWh:rec?.warehouseId||null,orig,targetType:rec?.targetType||preset||'retail',targetId:rec?.targetId||'',targetText:rec?targetLabel(rec.targetType,rec.targetId):'',receiver:rec?.receiver||'',note:rec?.note||'',
    lines:rec?rec.lines.map(l=>({itemId:l.itemId,itemText:'',qty:l.qty,price:0,serialsText:'',warranty:'',assetIds:[...(l.assetIds||[])]})):[newLine()]}}

function targetField(){

    :`${date}${wh}<label class="f"><span>Đối tượng nhận</span><select class="in" data-slip="targetType"><option value="retail" ${S.targetType==='retail'?'selected':''}>Khách lẻ</option><option value="project" ${S.targetType==='project'?'selected':''}>Khách hàng / Dự án</option></select></label><div id="tgt" class="contents">${targetField()}</div><label class="f"><span>Người nhận hàng</span><input class="in" data-slip="receiver" value="${esc(S.receiver)}"></label>`;
  return `<div class="fg3">${head}<label class="f full"><span>${isR?'Ghi chú':'Mục đích / Ghi chú'}</span><input class="in" data-slip="note" value="${esc(S.note)}"></label></div>

function availOf(l){const it=itemOf(l.itemId);if(!it)return 0;let a=stockMap()[it.id]?.[S.warehouseId]||0;if(S.id&&S.kind==='issue'&&S.origWh===S.warehouseId)a+=S.orig[it.id]||0;return a}
function renderLines(){
  const isR=S.kind==='receipt',m=stockMap();
  $('#lines').innerHTML=S.lines.map((l,i)=>{
    const it=itemOf(l.itemId),isIT=!!(it&&catOf(it.categoryId)?.isIT),tracked=isR?serialsOf(l).length>0:l.assetIds.length>0;
    let avail=0;if(it&&!isR){avail=m[it.id]?.[S.warehouseId]||0;if(S.id&&S.origWh===S.warehouseId)avail+=S.orig[it.id]||0}
    const item=`<input class="in itm" data-cb="item" data-idx="${i}" autocomplete="off" placeholder="Bấm để chọn hoặc gõ mã / tên hàng…" value="${esc(it?itemLabel(it):l.itemText||'')}" data-l="${i}:itemText" aria-label="Hàng hóa">`;
    const qty=`<input class="in" type="number" min="0" step="any" value="${l.qty}" data-l="${i}:qty" ${tracked?'readonly':''} aria-label="Số lượng">`;
    const del=`<button type="button" class="btn sm danger" data-act="ln-del" data-i="${i}" aria-label="Xoá dòng">✕</button>`;
    const main=isR
      ?`<div class="ln-main isr">${item}<span class="unit">${esc(it?.unit||'')}</span>${qty}<input class="in" type="number" min="0" step="any" value="${l.price}" data-l="${i}:price" placeholder="Đơn giá" aria-label="Đơn giá"><span class="amt">${fmtMoney(l.qty*l.price)}</span>${del}</div>`
      :`<div class="ln-main">${item}<span class="unit">${esc(it?.unit||'')}</span>${it?`<span class="stk ${l.qty>avail?'bad':''}">Tồn: ${fmtNum(avail)}</span>`:'<span></span>'}${qty}${del}</div>`;
    let extra='';
    if(it&&isIT&&isR)extra=`<div class="ser"><textarea class="in" placeholder="Serial / Service Tag – mỗi dòng một thiết bị (bỏ trống nếu không quản lý theo Serial)" data-l="${i}:serialsText">${esc(l.serialsText)}</textarea><label class="f"><span>Bảo hành (tháng)</span><input class="in" type="number" min="0" value="${esc(l.warranty)}" data-l="${i}:warranty"></label></div>`;
    if(it&&isIT&&!isR){
      const av=db.assets.filter(a=>a.itemId===it.id&&((a.status==='in_stock'&&a.warehouseId===S.warehouseId)||(S.id&&a.issueId===S.id)));
      extra=`<details ${l.assetIds.length?'open':''}><summary>Chọn thiết bị theo Serial (${av.length} khả dụng) · <span class="asum">đã chọn ${l.assetIds.length}</span></summary><div class="alist">${av.map(a=>`<label class="chk"><input type="checkbox" data-as="${i}:${a.id}" ${l.assetIds.includes(a.id)?'checked':''}> ${esc(a.tag)} · ${esc(a.serial||'—')}</label>`).join('')||'<em class="muted">Không có thiết bị khả dụng trong kho này.</em>'}</div></details>`;
    }
    return `<div class="ln" data-i="${i}">${main}${extra}</div>`;
  }).join('');
  renderTotals();
}
function renderTotals(){
  const q=S.lines.reduce((a,l)=>a+(+l.qty||0),0),v=S.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0);
  const t=$('#tot');if(t)t.innerHTML=`<span>Tổng số lượng: ${fmtNum(q)}</span>${S.kind==='receipt'?`<span>Tổng tiền: ${fmtMoney(v)} ₫</span>`:''}`;
}
function syncLineUI(i){
  const l=S.lines[i],row=$(`.ln[data-i="${i}"]`);
  if(row){
    const tracked=S.kind==='receipt'?serialsOf(l).length>0:l.assetIds.length>0,q=$('[data-l$=":qty"]',row);
    if(q){if(tracked||document.activeElement!==q)q.value=l.qty;q.readOnly=tracked}
    const a=$('.amt',row);if(a)a.textContent=fmtMoney(l.qty*l.price);
    const sm=$('.asum',row);if(sm)sm.textContent=`đã chọn ${l.assetIds.length}`;
    const st=$('.stk',row);if(st)st.classList.toggle('bad',l.qty>availOf(l));
  }
  renderTotals();
}
function pickItem(i,it){const l=S.lines[i];l.itemId=it.id;l.itemText='';l.assetIds=[];l.serialsText='';if(S.kind==='receipt'&&!l.price)l.price=it.price||0;renderLines()}
function lineInput(el){
  const [is,k]=el.dataset.l.split(':'),i=+is,l=S.lines[i];if(!l)return;
  if(k==='itemText'){l.itemText=el.value;const it=itemByText(el.value,true);if(it&&it.id!==l.itemId)pickItem(i,it);return}
  if(k==='qty'||k==='price')l[k]=num(el.value);else l[k]=el.value;
  if(k==='serialsText'){const n=serialsOf(l).length;if(n>0)l.qty=n}
  syncLineUI(i);
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.t&&T){T.actual[el.dataset.t]=el.value;const c=document.getElementById('df-'+el.dataset.t);if(c)c.innerHTML=diffHtml(el.value,+el.dataset.sys);return}
  if(!S||!el.dataset)return;
  if(el.dataset.slip){S[el.dataset.slip]=el.value;return}
  if(el.dataset.l)lineInput(el);
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset)return;
  if(T&&el.dataset.tk){T[el.dataset.tk]=el.value;if(el.dataset.tk!=='note')renderTake();return}
  if(!S)return;
  if(el.dataset.slip){
    const k=el.dataset.slip;S[k]=el.value;
    if(k==='warehouseId'){if(S.kind==='issue')S.lines.forEach(l=>l.assetIds=[]);renderLines()}
    if(k==='targetType'){S.targetId='';S.targetText='';$('#tgt').innerHTML=targetField()}
    return;
  }
  if(el.dataset.l&&el.dataset.l.endsWith(':itemText')){
    const i=+el.dataset.l.split(':')[0],l=S.lines[i],it=itemByText(el.value);
    if(it){if(it.id!==l.itemId)pickItem(i,it);el.classList.remove('bad')}
    else if(!el.value.trim()){l.itemId='';l.itemText='';l.assetIds=[];renderLines()}
    else{l.itemId='';l.itemText=el.value;el.classList.add('bad')}
    return;
  }
  if(el.dataset.as){
    const [is,aid]=el.dataset.as.split(':'),l=S.lines[+is],set=new Set(l.assetIds);
    el.checked?set.add(aid):set.delete(aid);l.assetIds=[...set];if(l.assetIds.length)l.qty=l.assetIds.length;syncLineUI(+is);
  }
});
ACT['ln-add']=()=>{S.lines.push(newLine());renderLines()};

function collectLines(){
  const out=[];
  for(let i=0;i<S.lines.length;i++){
    const l=S.lines[i];if(!l.itemId&&!(l.itemText||'').trim())continue;
    if(!l.itemId){toast(`Dòng ${i+1}: hãy chọn đúng hàng hóa từ danh sách gợi ý.`,'error');return null}
    if(S.kind==='receipt'){
      const serials=serialsOf(l),qty=serials.length||num(l.qty);
      if(qty<=0){toast(`Dòng ${i+1}: số lượng phải lớn hơn 0.`,'error');return null}
      if(new Set(serials.map(s=>s.toLowerCase())).size!==serials.length){toast(`Dòng ${i+1}: Serial bị trùng nhau.`,'error');return null}
      out.push({itemId:l.itemId,qty,price:num(l.price),serials,warranty:num(l.warranty)});
    }else{
      const qty=l.assetIds.length||num(l.qty);
      if(qty<=0){toast(`Dòng ${i+1}: số lượng phải lớn hơn 0.`,'error');return null}
      out.push({itemId:l.itemId,qty,price:itemOf(l.itemId)?.price||0,assetIds:[...l.assetIds]});
    }
  }
  if(!out.length){toast('Phiếu chưa có hàng hóa.','error');return null}
  return out;
}
function saveReceipt(){
  if(!S.warehouseId||!S.date)return toast('Chọn ngày và kho.','error');
  const lines=collectLines();if(!lines)return;
  const data={date:S.date,warehouseId:S.warehouseId,supplierId:S.supplierId,ref:S.ref,note:S.note,lines};
  if(transact(()=>{
    const r=S.id?by(db.receipts,S.id):null;
    if(r){Object.assign(r,data);syncReceiptAssets(r)}else _newReceipt(data);
    lines.forEach(l=>{if(l.price>0)itemOf(l.itemId).price=l.price});
  }))done('Đã lưu phiếu nhập');
}
function saveIssue(){
  if(!S.warehouseId||!S.date)return toast('Chọn ngày và kho.','error');
  const tText=(S.targetText||'').trim();
  if(!tText)return toast(S.targetType==='project'?'Chọn khách hàng / dự án.':'Nhập tên khách lẻ.','error');
  let proj=null;
  if(S.targetType==='project'){proj=resolveProject(tText);if(!proj)return toast('Không tìm thấy khách hàng / dự án này trong danh mục. Hãy chọn từ danh sách gợi ý, hoặc thêm mới ở Thông tin → Khách hàng/dự án.','error')}
  const lines=collectLines();if(!lines)return;
  if(transact(()=>{
    let tid=proj?proj.id:'';
    if(S.targetType==='retail'){let c=db.retail.find(x=>norm(x.name)===norm(tText));if(!c){c={id:uid('rt'),name:tText,phone:'',dept:'',note:''};db.retail.push(c)}tid=c.id}
    const data={date:S.date,warehouseId:S.warehouseId,targetType:S.targetType,targetId:tid,receiver:S.receiver,note:S.note,lines};
    const r=S.id?by(db.issues,S.id):null;
    if(r){revertIssueAssets(r);Object.assign(r,data);applyIssueAssets(r)}else _newIssue(data);
  }))done('Đã lưu phiếu xuất');
}

/* ---- xem / in / PDF / xoá phiếu ---- */
const slipRec=(k,id)=>k==='receipt'?by(db.receipts,id):by(db.issues,id);
const slipKind=k=>k==='receipt'?'in':'out';
ACT['slip-view']=el=>{
  const k=el.dataset.k,r=slipRec(k,el.dataset.id);if(!r)return;const w=can('write'),a=`data-k="${k}" data-id="${r.id}"`;
  modal(r.code,slipHTML(slipKind(k),r),{size:'mid',footer:`${w?`<button class="btn danger" data-act="slip-del" ${a}>Xoá</button><button class="btn" data-act="slip-edit" ${a}>Sửa</button>`:''}<div class="sp"></div><button class="btn" data-act="slip-print" ${a}>🖨 In</button><button class="btn acc" data-act="slip-pdf" ${a}>Xuất PDF</button>`});
};
ACT['slip-print']=el=>{const r=slipRec(el.dataset.k,el.dataset.id);if(r)printHTML(slipHTML(slipKind(el.dataset.k),r))};
ACT['slip-pdf']=async el=>{const r=slipRec(el.dataset.k,el.dataset.id);if(!r)return;const box=offscreen(slipHTML(slipKind(el.dataset.k),r));await pdfFromEls([box],`${r.code}.pdf`);box.remove()};
ACT['slip-del']=el=>{
  const k=el.dataset.k,r=slipRec(k,el.dataset.id);if(!r||!confirm(`Xoá phiếu ${r.code}? Tồn kho và tài sản liên quan sẽ được hoàn lại.`))return;
  const ok=transact(()=>{
    if(k==='receipt'){
      db.assets.filter(a=>a.receiptId===r.id).forEach(a=>{if(a.status!=='in_stock'||!a.counted)throw new Error(`Thiết bị ${a.tag} đã được cấp phát/xử lý nên không thể xoá phiếu nhập.`)});
      db.assets=db.assets.filter(a=>a.receiptId!==r.id);db.receipts=db.receipts.filter(x=>x!==r);
    }else{revertIssueAssets(r);db.issues=db.issues.filter(x=>x!==r)}
  });
  if(ok)done('Đã xoá phiếu');
};

const ST={in_stock:['ok','Trong kho'],assigned:['info','Đã cấp phát'],repair:['warn','Sửa chữa'],retired:['mute','Thanh lý']};
const holderLabel=a=>a.holder?targetLabel(a.holder.type,a.holder.id):'';
function warrCell(a){
  if(!a.warrantyEnd)return'<span class="muted">—</span>';
  const t=todayStr();if(a.status==='retired')return fmtDate(a.warrantyEnd);
  if(a.warrantyEnd<t)return `<span class="tag-bad">${fmtDate(a.warrantyEnd)} (hết BH)</span>`;
  if(a.warrantyEnd<=addDays(t,60))return `<span class="tag-warn">${fmtDate(a.warrantyEnd)}</span>`;
  return fmtDate(a.warrantyEnd);
}
function assetPage(cat){
  const list=()=>db.assets.filter(a=>itemOf(a.itemId)?.categoryId===cat.id);
  return{t:cat.name,
    head(){
      const L=list(),c=s=>L.filter(a=>a.status===s).length;
      return `<div class="kpis sm">${kpi('Tổng thiết bị',L.length)}${kpi('Trong kho',c('in_stock'),'','ok')}${kpi('Đã cấp phát',c('assigned'),'','info')}${kpi('Sửa chữa',c('repair'),'','warn')}${kpi('Thanh lý',c('retired'))}</div>
      <div class="bar">${fSearch('Tìm mã TS / serial / thiết bị / người dùng…')}${fSel('st','Trạng thái',[['','Mọi trạng thái'],...Object.entries(ST).map(([k,v])=>[k,v[1]])])}<div class="sp"></div><button class="btn" data-act="export" data-name="it-${slug(cat.name)}">⬇ Excel</button>${can('write')?`<button class="btn acc" data-act="asset-new" data-cat="${cat.id}">＋ Thêm tài sản</button>`:''}</div>`;
    },
    tbl(){
      const f=F(),q=(f.q||'').toLowerCase(),w=can('write');
      const rows=list().filter(a=>(!f.st||a.status===f.st)&&(!q||[a.tag,a.serial,a.spec,nm(db.items,a.itemId),holderLabel(a)].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.tag.localeCompare(b.tag));
      return table([{h:'Mã TS',f:a=>`<b>${esc(a.tag)}</b>`,x:a=>a.tag},{h:'Thiết bị',f:a=>`${esc(nm(db.items,a.itemId))}${a.spec?`<small>${esc(a.spec)}</small>`:''}`,x:a=>nm(db.items,a.itemId)+(a.spec?' – '+a.spec:'')},{h:'Serial',f:a=>esc(a.serial||'—'),x:a=>a.serial||''},{h:'Trạng thái',f:a=>badge(...ST[a.status]),x:a=>ST[a.status][1]},
        {h:'Vị trí / Người dùng',f:a=>a.status==='assigned'?esc(holderLabel(a)):esc(whName(a.warehouseId)),x:a=>a.status==='assigned'?holderLabel(a):whName(a.warehouseId)},{h:'Ngày mua',f:a=>fmtDate(a.purchaseDate),x:a=>a.purchaseDate||''},{h:'Hết bảo hành',f:warrCell,x:a=>a.warrantyEnd||''},
        actCol(a=>`<button class="btn sm" data-act="asset-hist" data-id="${a.id}">Lịch sử</button>${w?` <button class="btn sm" data-act="asset-act" data-id="${a.id}">Thao tác</button> <button class="btn sm" data-act="asset-edit" data-id="${a.id}" data-cat="${cat.id}">Sửa</button>`:''}`)],rows,{empty:'Chưa có thiết bị. Thiết bị được tạo tự động khi nhập kho kèm Serial, hoặc bấm “Thêm tài sản”.'});
    }};
}
const holderSelect=v=>`<label class="f full"><span>Người dùng / dự án đang giữ (nếu trạng thái là Đã cấp phát)</span><select class="in" name="holder"><option value="">— chọn —</option><optgroup label="Khách lẻ">${db.retail.map(c=>`<option value="retail:${c.id}" ${v==='retail:'+c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup><optgroup label="Khách hàng / Dự án">${db.projects.map(p=>`<option value="project:${p.id}" ${v==='project:'+p.id?'selected':''}>${esc(p.code+' – '+p.name)}</option>`).join('')}</optgroup></select></label>`;
function assetForm(catId,id){
  const a=id?by(db.assets,id):null,items=db.items.filter(i=>i.categoryId===catId);
  if(!a&&!items.length)return toast('Chưa có hàng hóa thuộc danh mục này. Hãy thêm ở “Danh sách hàng hóa” trước.','warn');
  modal(a?`Sửa tài sản ${a.tag}`:'Thêm tài sản',`<form id="mf" data-submit="asset-save" data-id="${id||''}"><div class="fg">
    ${sel('itemId','Hàng hóa / Model',(a?db.items.filter(i=>i.id===a.itemId):items).map(i=>[i.id,itemLabel(i)]),a?.itemId,{req:1,full:1,attrs:a?'disabled':''})}
    ${inp('serial','Serial / Service Tag',a?.serial||'')}${inp('spec','Cấu hình / Mô tả',a?.spec||'',{ph:'VD: i7 / 16GB / 512GB'})}
    ${a?'':sel('warehouseId','Kho',db.warehouses.map(w=>[w.id,w.name]),db.warehouses[0]?.id)}
    ${a?'':sel('status','Trạng thái ban đầu',[['in_stock','Trong kho'],['assigned','Đã cấp phát']],'in_stock')}
    ${inp('purchaseDate','Ngày mua',a?.purchaseDate||'',{type:'date'})}${inp('warrantyEnd','Hết bảo hành',a?.warrantyEnd||'',{type:'date'})}
    ${a?'':holderSelect('')}
    ${txa('note','Ghi chú',a?.note||'',{full:1})}
    ${a?'':chk('addStock','Cộng 1 vào tồn kho (dùng cho tồn đầu kỳ; bỏ chọn nếu thiết bị đã được tính qua phiếu nhập)',true)}
  </div></form>`,{footer:cancelBtn+`<button class="btn primary" form="mf">Lưu tài sản</button>`});
}
ACT['asset-new']=el=>assetForm(el.dataset.cat);ACT['asset-edit']=el=>assetForm(el.dataset.cat,el.dataset.id);
SUB['asset-save']=form=>{
  const d=fd(form),id=form.dataset.id;
  const ok=transact(()=>{
    if(id){const a=by(db.assets,id);
      if(d.serial.trim()&&db.assets.some(x=>x.id!==id&&x.itemId===a.itemId&&(x.serial||'').toLowerCase()===d.serial.trim().toLowerCase()))throw new Error('Serial đã tồn tại.');
      Object.assign(a,{serial:d.serial.trim(),spec:d.spec||'',purchaseDate:d.purchaseDate||'',warrantyEnd:d.warrantyEnd||'',note:d.note||''});addHist(a,'Cập nhật','Chỉnh sửa thông tin');return}
    const serial=d.serial.trim();
    if(serial&&db.assets.some(x=>x.itemId===d.itemId&&(x.serial||'').toLowerCase()===serial.toLowerCase()))throw new Error('Serial đã tồn tại.');
    const a={id:uid('a'),tag:nextTag(),itemId:d.itemId,serial,spec:d.spec||'',status:'in_stock',counted:true,warehouseId:d.warehouseId,holder:null,issueId:null,receiptId:null,purchaseDate:d.purchaseDate||'',warrantyEnd:d.warrantyEnd||'',note:d.note||'',history:[]};
    if(d.status==='assigned'){
      if(!d.holder)throw new Error('Chọn người dùng / dự án đang giữ thiết bị.');
      const [type,hid]=d.holder.split(':');a.status='assigned';a.counted=false;a.holder={type,id:hid};addHist(a,'Thêm thủ công',`Đang cấp phát cho ${targetLabel(type,hid)}`);
    }else{addHist(a,'Thêm thủ công','Ghi nhận vào kho');if(d.addStock)pushAdj(a.itemId,a.warehouseId,1,`Tồn đầu kỳ – tài sản ${a.tag}`)}
    db.assets.push(a);
  });
  if(ok)done();
};
ACT['asset-hist']=el=>{
  const a=by(db.assets,el.dataset.id);if(!a)return;
  modal(`Lịch sử ${a.tag}`,`<p class="note">${esc(nm(db.items,a.itemId))} · Serial: ${esc(a.serial||'—')} · ${badge(...ST[a.status])}</p>`+miniTable(['Ngày','Thao tác','Chi tiết','Người thực hiện'],[...(a.history||[])].reverse().map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${esc(h.action)}</td><td>${esc(h.detail||'')}</td><td>${esc(h.by||'')}</td></tr>`),'Chưa có lịch sử.'),{size:'mid',footer:'<button class="btn" data-act="close">Đóng</button>'});
};
ACT['asset-act']=el=>{
  const a=by(db.assets,el.dataset.id);if(!a)return;
  const acts={in_stock:[['repair','Gửi sửa chữa'],['retire','Thanh lý / loại bỏ']],assigned:[['return','Thu hồi về kho'],['repair','Gửi sửa chữa'],['retire','Thanh lý / loại bỏ']],repair:[['fixed','Sửa xong – nhập lại kho'],['retire','Thanh lý / loại bỏ']],retired:[]}[a.status];
  if(!acts.length)return toast('Thiết bị đã thanh lý, không còn thao tác nào.','warn');
  modal(`Thao tác – ${a.tag}`,`<form id="mf" data-submit="asset-act" data-id="${a.id}"><p class="note">${esc(nm(db.items,a.itemId))} · ${badge(...ST[a.status])}${a.status==='assigned'?' · '+esc(holderLabel(a)):''}<br>Muốn cấp phát thiết bị đang trong kho, hãy tạo <b>Phiếu xuất</b> và chọn Serial.</p><div class="fg">${sel('act','Thao tác',acts,acts[0][0],{full:1})}${sel('warehouseId','Kho nhận lại (khi thu hồi / sửa xong)',db.warehouses.map(w=>[w.id,w.name]),a.warehouseId)}${inp('date','Ngày',todayStr(),{type:'date'})}${txa('note','Ghi chú','',{full:1})}</div></form>`,{footer:cancelBtn+`<button class="btn primary" form="mf">Xác nhận</button>`});
};
SUB['asset-act']=form=>{
  const d=fd(form);
  const ok=transact(()=>{
    const a=by(db.assets,form.dataset.id),w=d.warehouseId||a.warehouseId,date=d.date||todayStr(),n=d.note?` – ${d.note}`:'';
    if(d.act==='return'){if(!a.counted){pushAdj(a.itemId,w,1,`Thu hồi ${a.tag}`,date);a.counted=true}a.status='in_stock';a.holder=null;a.issueId=null;a.warehouseId=w;addHist(a,'Thu hồi',`Về ${whName(w)}${n}`,date)}
    else if(d.act==='repair'){a.status='repair';addHist(a,'Sửa chữa',`Gửi sửa chữa${n}`,date)}
    else if(d.act==='fixed'){if(!a.counted){pushAdj(a.itemId,w,1,`Sửa xong ${a.tag}`,date);a.counted=true}a.status='in_stock';a.holder=null;a.issueId=null;a.warehouseId=w;addHist(a,'Hoàn tất sửa chữa',`Nhập lại ${whName(w)}${n}`,date)}
    else if(d.act==='retire'){if(a.counted){pushAdj(a.itemId,a.warehouseId,-1,`Thanh lý ${a.tag}`,date);a.counted=false}a.status='retired';a.holder=null;addHist(a,'Thanh lý',`Loại bỏ thiết bị${n}`,date)}
  });
  if(ok)done('Đã cập nhật thiết bị');
};

const firstOfYear=()=>`${new Date().getFullYear()}-01-01`;
const periodSub=(from,to)=>`Kỳ: ${from?fmtDate(from):'…'} – ${to?fmtDate(to):'…'}`;
PAGES['rpt/monthly']={t:'Báo cáo Nhập – Xuất – Tồn theo tháng',
  sub(){const f=F();return `Tháng ${(f.month||todayStr().slice(0,7)).split('-').reverse().join('/')} · ${f.wh?whName(f.wh):'Tất cả kho'}`},
  head(){return `<div class="bar">${fMonth('month','Tháng',todayStr().slice(0,7))}${fSel('wh','Kho',whOpts())}${fSel('cat','Danh mục',catOpts())}<div class="sp"></div>${rptBtns('nxt-thang')}</div>`},
  tbl(){
    const f=F(),mk=f.month||todayStr().slice(0,7),from=mk+'-01',to=addDays(addMonths(from,1),-1),wh=f.wh;
    const op=stockMap(from,true),cl=stockMap(to),fi=flow('receipts',from,to,wh),fo=flow('issues',from,to,wh);
    const rows=db.items.filter(i=>!f.cat||i.categoryId===f.cat).map(i=>{const o=qtyIn(op,i.id,wh),c=qtyIn(cl,i.id,wh),a=fi[i.id]?.qty||0,b=fo[i.id]?.qty||0;return{i,o,a,b,adj:Math.round((c-o-a+b)*1000)/1000,c}}).filter(r=>r.o||r.a||r.b||r.adj||r.c);
    const sum=k=>rows.reduce((s,r)=>s+r[k],0);
    const vi=Object.values(fi).reduce((s,x)=>s+x.val,0),vo=Object.values(fo).reduce((s,x)=>s+x.val,0);
    return `<div class="kpis">${kpi('Tồn đầu kỳ',fmtNum(sum('o')))}${kpi('Nhập trong tháng',fmtNum(sum('a')),fmtMoney(vi)+' ₫','ok')}${kpi('Xuất trong tháng',fmtNum(sum('b')),fmtMoney(vo)+' ₫','warn')}${kpi('Tồn cuối kỳ',fmtNum(sum('c')),'','info')}</div>`+
    table([{h:'Mã hàng',f:r=>`<b>${esc(r.i.sku)}</b>`,x:r=>r.i.sku},{h:'Tên hàng hóa',f:r=>esc(r.i.name),x:r=>r.i.name},{h:'ĐVT',f:r=>esc(r.i.unit)},nc('Tồn đầu',r=>r.o),nc('Nhập',r=>r.a),nc('Xuất',r=>r.b),nc('Điều chỉnh',r=>r.adj),nc('Tồn cuối',r=>r.c),nc('Giá trị tồn cuối (₫)',r=>r.c*(r.i.price||0),fmtMoney)],rows,{empty:'Không có phát sinh trong tháng này.',foot:`<tr><td colspan="3">Tổng</td><td class="num">${fmtNum(sum('o'))}</td><td class="num">${fmtNum(sum('a'))}</td><td class="num">${fmtNum(sum('b'))}</td><td class="num">${fmtNum(sum('adj'))}</td><td class="num">${fmtNum(sum('c'))}</td><td class="num">${fmtMoney(rows.reduce((s,r)=>s+r.c*(r.i.price||0),0))}</td></tr>`});
  }};
function issueReport(type,title){
  const targets=()=>type==='project'?db.projects.map(p=>[p.id,`${p.code} – ${p.name}`]):db.retail.map(c=>[c.id,c.name]);
  return{t:title,
    sub(){const f=F();return `${f.target?targetLabel(type,f.target):'Tất cả'} · ${periodSub(f.from??firstOfYear(),f.to??todayStr())}`},
    head(){return `<div class="bar">${fSel('target',type==='project'?'Dự án':'Khách lẻ',[['',type==='project'?'Tất cả dự án':'Tất cả khách lẻ'],...targets()])}${fDate('from','Từ',firstOfYear())}${fDate('to','Đến',todayStr())}<div class="sp"></div>${rptBtns(type==='project'?'bao-cao-du-an':'bao-cao-khach-le')}</div>`},
    tbl(){
      const f=F(),from=f.from??firstOfYear(),to=f.to??todayStr(),agg={};
      db.issues.forEach(r=>{if(r.targetType!==type||(f.target&&r.targetId!==f.target)||(from&&r.date<from)||(to&&r.date>to))return;
        r.lines.forEach(l=>{const k=r.targetId+'|'+l.itemId,x=(agg[k]??={tid:r.targetId,iid:l.itemId,qty:0,val:0,slips:new Set()});x.qty+=+l.qty||0;x.val+=(+l.qty||0)*(+l.price||0);x.slips.add(r.id)})});
      const rows=Object.values(agg).sort((a,b)=>targetLabel(type,a.tid).localeCompare(targetLabel(type,b.tid))||(itemOf(a.iid)?.sku||'').localeCompare(itemOf(b.iid)?.sku||''));
      const tot=rows.reduce((s,r)=>({q:s.q+r.qty,v:s.v+r.val}),{q:0,v:0}),nT=new Set(rows.map(r=>r.tid)).size;
      return `<div class="kpis">${kpi(type==='project'?'Số dự án':'Số khách lẻ',nT)}${kpi('Tổng số lượng xuất',fmtNum(tot.q),'','warn')}${kpi('Tổng giá trị (₫)',fmtMoney(tot.v),'','acc')}</div><div class="card"><h4>Giá trị xuất theo ${type==='project'?'dự án':'khách lẻ'} (top 10)</h4><div class="ch"><canvas id="c1"></canvas></div></div>`+
      table([{h:type==='project'?'Khách hàng / Dự án':'Khách lẻ',f:r=>esc(targetLabel(type,r.tid)),x:r=>targetLabel(type,r.tid)},{h:'Mã hàng',f:r=>esc(itemOf(r.iid)?.sku||'?')},{h:'Tên hàng hóa',f:r=>esc(itemOf(r.iid)?.name||'(đã xoá)')},{h:'ĐVT',f:r=>esc(itemOf(r.iid)?.unit||'')},nc('Số lượng',r=>r.qty),nc('Giá trị (₫)',r=>r.val,fmtMoney),nc('Số phiếu',r=>r.slips.size)],rows,{empty:'Không có phát sinh trong khoảng thời gian này.',foot:`<tr><td colspan="4">Tổng</td><td class="num">${fmtNum(tot.q)}</td><td class="num">${fmtMoney(tot.v)}</td><td></td></tr>`});
    },
    tm(){
      const f=F(),from=f.from??firstOfYear(),to=f.to??todayStr(),agg={};
      db.issues.forEach(r=>{if(r.targetType!==type||(f.target&&r.targetId!==f.target)||(from&&r.date<from)||(to&&r.date>to))return;r.lines.forEach(l=>{agg[r.targetId]=(agg[r.targetId]||0)+(+l.qty||0)*(+l.price||0)})});
      const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,10);
      chart('c1',{type:'bar',data:{labels:top.map(([id])=>targetLabel(type,id)),datasets:[{label:'Giá trị (₫)',data:top.map(x=>x[1]),backgroundColor:PAL[0]}]},options:baseOpt({plugins:{legend:{display:false}}})});
    }};
}

let cbState=null;
function cbPop(){let p=document.getElementById('cb-pop');if(!p){p=document.createElement('div');p.id='cb-pop';p.className='cbp';p.hidden=true;document.body.appendChild(p)}return p}
function cbOptions(kind){
  if(kind==='retail')return db.retail.map(c=>({id:c.id,label:c.name,sub:[c.dept,c.phone].filter(Boolean).join(' · '),key:norm(c.name+' '+(c.dept||''))}));
  if(kind==='project')return db.projects.map(p=>({id:p.id,label:`${p.code} – ${p.name}`,sub:[p.taxId?'MST '+p.taxId:'',p.address].filter(Boolean).join(' · '),key:norm(p.code+' '+p.name+' '+(p.taxId||''))}));
  if(kind==='item'){const m=stockMap();return db.items.map(i=>({id:i.id,label:itemLabel(i),sub:`Tồn ${fmtNum(totalOf(m,i.id))} ${i.unit}`,key:norm(i.sku+' '+i.name)}))}
  return[];
}
function cbOpen(el){
  const kind=el.dataset.cb,all=cbOptions(kind);
  cbState={el,kind,all,list:[],idx:0,showAll:all.some(o=>o.label===el.value)};
  cbFilter();
}
function cbFilter(){
  const s=cbState;if(!s)return;
  const toks=s.showAll?[]:norm(s.el.value).split(' ').filter(Boolean);
  s.list=s.all.filter(o=>toks.every(t=>o.key.includes(t))).slice(0,80);
  s.idx=s.list.length?0:-1;cbRender();
}
function cbRender(){
  const s=cbState,p=cbPop();if(!s)return;
  p.innerHTML=s.list.length?s.list.map((o,i)=>`<div class="cbo ${i===s.idx?'on':''}" data-cbi="${i}"><b>${esc(o.label)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:''}</div>`).join(''):`<div class="cbe">Không có kết quả${s.kind==='retail'&&s.el.value.trim()?` – sẽ thêm “${esc(s.el.value.trim())}” làm khách lẻ mới khi lưu phiếu`:s.kind==='project'?'. Thêm mới ở Thông tin → Khách hàng/dự án':''}</div>`;
  const r=s.el.getBoundingClientRect(),below=window.innerHeight-r.bottom-10,up=below<170&&r.top>below;
  p.style.left=Math.max(6,Math.min(r.left,window.innerWidth-Math.max(r.width,320)-6))+'px';p.style.width=Math.max(r.width,320)+'px';
  if(up){p.style.top='auto';p.style.bottom=(window.innerHeight-r.top+2)+'px';p.style.maxHeight=Math.min(300,r.top-12)+'px'}
  else{p.style.bottom='auto';p.style.top=(r.bottom+2)+'px';p.style.maxHeight=Math.min(300,below)+'px'}
  p.hidden=false;
  const on=p.querySelector('.cbo.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
}
function cbClose(){cbState=null;const p=document.getElementById('cb-pop');if(p)p.hidden=true}
function cbPick(i){
  const s=cbState;if(!s)return;const o=s.list[i];if(!o)return;const el=s.el;
  el.value=o.label;cbClose();
  if(s.kind==='item'){const it=itemOf(o.id);if(it&&S)pickItem(+el.dataset.idx,it)}
  else if(S){S.targetText=o.label;S.targetId=o.id}
}
document.addEventListener('focusin',e=>{const el=e.target;if(el.dataset&&el.dataset.cb&&!(cbState&&cbState.el===el))cbOpen(el)});
document.addEventListener('click',e=>{const el=e.target;if(el.dataset&&el.dataset.cb&&!cbState)cbOpen(el)});
document.addEventListener('input',e=>{if(cbState&&e.target===cbState.el){cbState.showAll=false;cbFilter()}});
document.addEventListener('keydown',e=>{
  const s=cbState;if(!s)return;
  if(e.key==='ArrowDown'){e.preventDefault();if(s.list.length){s.idx=(s.idx+1)%s.list.length;cbRender()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(s.list.length){s.idx=(s.idx-1+s.list.length)%s.list.length;cbRender()}}
  else if(e.key==='Enter'){if(s.idx>=0){e.preventDefault();cbPick(s.idx)}}
  else if(e.key==='Escape'){e.preventDefault();cbClose()}
  else if(e.key==='Tab'){cbClose()}
});
document.addEventListener('mousedown',e=>{
  const o=e.target.closest&&e.target.closest('.cbo');
  if(o){e.preventDefault();cbPick(+o.dataset.cbi);return}
  if(cbState&&e.target!==cbState.el&&!(e.target.closest&&e.target.closest('#cb-pop')))cbClose();
});
document.addEventListener('scroll',e=>{if(cbState&&!(e.target.closest&&e.target.closest('#cb-pop')))cbClose()},true);
window.addEventListener('resize',cbClose);

/* Tìm dự án từ chữ đã gõ: nhãn đầy đủ / mã / tên (duy nhất) */
function resolveProject(t){
  const n=norm(t);if(!n)return null;
  const x=db.projects.find(p=>norm(`${p.code} – ${p.name}`)===n||norm(p.code)===n);if(x)return x;
  const c=db.projects.filter(p=>norm(p.name)===n);return c.length===1?c[0]:null;
}

   (giữ nguyên id nên các phiếu, thiết bị đã liên kết không bị mất liên kết).

const SPECS={
  ncc:{title:'Upload file nhà cung cấp',need:{name:'Tên NCC'},fields:{code:['ma ncc','ma nha cung cap','ma'],name:['ten ncc','ten nha cung cap','ten'],address:['dia chi'],phone:['dien thoai','sdt','so dien thoai'],email:['email'],contact:['nguoi lien he','lien he']},apply:applySuppliers},
  kh:{title:'Upload file khách hàng',need:{name:'Tên KH'},fields:{code:['ma kh','ma khach hang','ma'],name:['ten kh','ten khach hang','ten'],tax:['mst','ma so thue'],address:['dia chi'],phone:['dien thoai','sdt'],contact:['nguoi lien he','lien he']},apply:applyCustomers},
  stock:{title:'Upload file số lượng tồn kho',need:{sku:'SKU',name:'Tên hàng'},warehouse:true,fields:{sku:['sku','ma hang','ma'],name:['ten hang','ten hang hoa','ten'],cat:['danh muc','nhom','loai'],unit:['dvt','don vi','don vi tinh'],qty:['ton kho','so luong','ton','sl'],price:['don gia','gia']},apply:applyStock}
};
function readSheet(file){
  return new Promise((res,rej)=>{
    if(!window.XLSX)return rej(new Error('Chưa tải được thư viện Excel (SheetJS). Kiểm tra kết nối mạng.'));
    const rd=new FileReader();
    rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});let rows=[];for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:true});if(r.length){rows=r;break}}res(rows)}catch(e){rej(e)}};
    rd.onerror=()=>rej(new Error('Không đọc được file.'));rd.readAsArrayBuffer(file);
  });
}
function mapRows(raw,spec){
  if(!raw.length)return{error:'File không có dữ liệu.'};
  const keys=Object.keys(raw[0]),col={};
  for(const f in spec.fields){const k=keys.find(k=>spec.fields[f].includes(norm(k)));if(k!==undefined)col[f]=k}
  const miss=Object.keys(spec.need).filter(f=>!col[f]);
  if(miss.length)return{error:`Thiếu cột: ${miss.map(f=>spec.need[f]).join(', ')}. Các cột tìm thấy trong file: ${keys.slice(0,8).join(', ')}`};
  return{rows:raw.map(r=>{const o={};for(const f in col)o[f]=r[col[f]];return o})};
}
function dryRun(fn){const snap=JSON.stringify(db);try{return fn()}finally{db=JSON.parse(snap)}}
const pickFile=cb=>{const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()};
async function startImport(kind,file){
  const spec=SPECS[kind];

    const m=mapRows(await readSheet(file),spec);if(m.error)return toast(m.error,'error');
    IMP={kind,file:file.name,rows:m.rows,wh:db.warehouses[0]?.id||'',spec};
    modal(spec.title,`<p class="note">File: <b>${esc(file.name)}</b> · ${fmtNum(m.rows.length)} dòng dữ liệu</p><div id="imp"></div>`,{size:'mid',footer:cancelBtn+'<button class="btn acc" data-act="imp-ok">Xác nhận nhập</button>'});
    renderImp();
  }catch(e){toast('Không đọc được file: '+e.message,'error')}
}

  IMP.err=false;
  const map=Object.values(rep.map||{});
  box.innerHTML=`${IMP.spec.warehouse?`<div class="fg" style="margin-bottom:12px"><label class="f"><span>Cập nhật tồn cho kho</span><select class="in" data-impwh>${db.warehouses.map(w=>`<option value="${w.id}" ${w.id===IMP.wh?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label></div>`:''}
  <div class="kpis sm">${kpi('Thêm mới',fmtNum(rep.add),'','ok')}${kpi('Ghi đè (có thay đổi)',fmtNum(rep.upd),'','warn')}${kpi('Giống hệt, không đổi',fmtNum(rep.same))}${(rep.extra||[]).map(([l,v])=>kpi(l,fmtNum(v),'','info')).join('')}</div>

  ${map.length?`<details><summary class="note">Danh mục được gộp vào danh mục có sẵn (${map.length})</summary><ul class="imp-notes">${map.map(x=>`<li>${esc(x.from)} → <b>${esc(x.to)}</b> (${x.n} mã)</li>`).join('')}</ul></details>`:''}
